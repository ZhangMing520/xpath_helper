<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" type="text/css" href="bar.css">
  </head>
  <body>
    <div id="row">
      <div id="query-box">
        <div class="box-name">Query:</div>
        <textarea id="query"></textarea>
      </div>
      <div id="vsplit" title="Drag to resize"></div>
      <div id="results-box">
        <div class="box-name">
          <span id="results-title">Results (<span id="node-count"></span>):</span>
          <button type="button" id="mode-toggle" class="mode-toggle"></button>
        </div>
        <div id="results-pane">
          <ul id="results-list"></ul>
          <textarea id="results" readonly="readonly"></textarea>
        </div>
      </div>
    </div>
    <div id="hsplit" title="Drag to resize height"></div>
    <script type="text/javascript" src="bar.js"></script>
  </body>
</html>
